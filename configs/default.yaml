# SGGNet Default Configuration
# For FAZ Segmentation in OCTA Images

# Data
data_root: "./data/OCTA-500"
img_size: 304          # 3M subset; use 400 for 6M
val_split: 0.0667     # 3M: 10/150; use 0.1 for 6M (20/200)

# Model
in_channels: 3
num_classes: 1
base_channels: 52

# Training
epochs: 100
batch_size: 2
lr: 1.0e-3
weight_decay: 1.0e-4
optimizer: adam
scheduler: none

# Seeds for multi-seed evaluation
seeds: [42, 123, 456, 789, 1024]

# Loss
bce_weight: 0.5
dice_weight: 0.5

# Logging
log_interval: 10
save_dir: "checkpoints"
log_dir: "logs"

# Evaluation
output_csv: "results.csv"
